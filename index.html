<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>💬 Random Quote Generator</h1>
    <button id="darkModeToggle" class="icon-btn" title="Toggle dark mode">🌙</button>
  </header>

  <main class="app-main">
    <div class="controls-row">
      <select id="categoryFilter">
        <option value="all">All categories</option>
      </select>
    </div>

    <div id="quoteCard" class="quote-card">
      <p id="quoteText" class="quote-text">Loading quote...</p>
      <p id="quoteAuthor" class="quote-author"></p>
      <span id="quoteCategory" class="quote-category"></span>
    </div>

    <div class="action-row">
      <button id="newQuoteBtn" class="primary-btn">🔄 New Quote</button>
      <button id="copyBtn" class="secondary-btn" title="Copy quote">📋 Copy</button>
      <a id="tweetBtn" class="secondary-btn" href="#" target="_blank" rel="noopener" title="Share on X/Twitter">🐦 Tweet</a>
    </div>

    <div class="autoplay-row">
      <label class="switch-label">
        <input type="checkbox" id="autoplayToggle">
        Auto-rotate every 8 seconds
      </label>
    </div>

    <p class="hint">Tip: press Space for a new quote</p>
  </main>

  <footer class="app-footer">
    Built for the CodeAlpha App Development Internship
  </footer>

  <script src="script.js"></script>
</body>
</html>
